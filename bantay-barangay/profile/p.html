<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
<style>
body{margin:0;display:flex;gap:40px;padding:40px;background:#ccc}
.t{width:1024px;height:1024px;display:grid;place-items:center;position:relative;overflow:hidden;font-family:Inter,sans-serif;font-weight:900}
.t span{font-size:640px;line-height:1;transform:translate(8px,-14px)}
#peach{background:#FFAB70}#peach span{color:#A6401F}
#flag{background:#0038A8}#flag span{color:#FCD116}
#white{background:#FBFCFE}#white span{color:#CE1126}
.stripe{position:absolute;left:0;right:0;bottom:0;height:0}
</style></head><body>
<div class="t" id="peach"><span>P</span></div>
<div class="t" id="flag"><span>P</span></div>
<div class="t" id="white"><span>P</span></div>
</body></html>
